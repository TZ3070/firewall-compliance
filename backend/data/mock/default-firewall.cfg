! MOCK DATA - Huawei HiSecEngine/USG VRP-style configuration
! Illustrative vendor CLI export. All identifiers and addresses are fictitious.
! This file corresponds to default-firewall.json used by the deterministic parser.

sysname FW-MOCK-01
#
undo telnet server enable
stelnet server enable
ssh server-source -i GigabitEthernet0/0/0
acl number 2000
 rule 5 permit source 192.0.2.32 0.0.0.31
ssh server acl 2000
http secure-server enable
undo http server enable
#
aaa
 local-user mock-security-admin service-type ssh terminal https
 local-user mock-security-admin level 15
 local-user mock-auditor service-type ssh https
 local-user mock-auditor level 3
 undo administrator multi-factor-authentication enable
#
interface GigabitEthernet0/0/0
 description MOCK-MANAGEMENT
 ip address 192.0.2.10 255.255.255.0
 service-manage ping permit
 service-manage ssh permit
 service-manage https permit
#
interface Eth-Trunk1.100
 description MOCK-TRUST
 ip address 198.51.100.33 255.255.255.224
 undo shutdown
#
interface Eth-Trunk1.200
 description MOCK-DMZ
 ip address 198.51.100.65 255.255.255.224
 undo shutdown
#
interface Eth-Trunk2
 description MOCK-UNTRUST
 ip address 203.0.113.2 255.255.255.248
 ipv6 enable
 ipv6 address 2001:DB8:100::2/64
 undo shutdown
#
firewall zone trust
 add interface Eth-Trunk1.100
#
firewall zone dmz
 add interface Eth-Trunk1.200
#
firewall zone untrust
 add interface Eth-Trunk2
#
firewall zone local
 add interface GigabitEthernet0/0/0
#
security-policy
 rule name ALLOW-HTTPS-TO-MOCK-DMZ
  source-zone untrust
  destination-zone dmz
  source-address 203.0.113.64 mask 255.255.255.224
  destination-address 198.51.100.70 mask 255.255.255.255
  service protocol tcp destination-port 443
  action permit
  log enable
 rule name TEMP-OPS-ANY-MOCK
  source-zone trust
  destination-zone dmz
  source-address 198.51.100.40 mask 255.255.255.255
  destination-address any
  service any
  action permit
  log enable
 rule name DEFAULT-DENY-MOCK
  source-zone any
  destination-zone any
  source-address any
  destination-address any
  service any
  action deny
  log enable
#
profile type ips name IPS-MOCK
 action block
#
profile type av name AV-MOCK
 protocol http action block
 protocol ftp action block
#
log type policy enable
log type threat enable
info-center enable
info-center logfile retention-days 30
info-center loghost 192.0.2.200 port 6514 transport tls
info-center loghost 192.0.2.201 port 514 transport udp
#
ntp-service enable
ntp-service unicast-server 192.0.2.123
ntp-service unicast-server 192.0.2.124 preference
#
hrp enable
hrp protocol HRP
! MOCK operational output: state=degraded
! MOCK operational output: configuration-synchronized=false
#
undo ipsec enable
#
return
